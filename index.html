<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <!-- search bar and city name -->
    <section class="container">
      <div class="row">
        <form class="col" id="search-form">
          <input
            type="text"
            id="search-input"
            aria-describedby="searchCity"
            placeholder="Search city..."
            class="search-form"
            autocomplete="off"
        
          />
          <button type="submit" class="submit-button">Search</button>
        </form>
        <h1
          class="col d-flex justify-content-center align-items-center city-title"
          id="searched-city"
        >
          Tbilisi
        </h1>
      </div>
    </section>

    <!-- temp and day info -->
    <section class="current-weather">
      <div class="container">
        <div class="row">
          <h1 class="col temp-title" id="current-temperature">4°</h1>
          <div class="col todays-info">
            <p id="current-time">11:00</p>
            <h2 id="current-day">Today</h2>
            <p id="weather-type">Cloudy</p>
          </div>
          <div class="col d-flex align-items-center side-info">
            <ul>
              <li>Humidity: <span id="humidity"></span></li>
              <li>Wind: <span id="wind"></span></li>
            </ul>
          </div>
        </div>
      </div>
      <hr />
    </section>

    <!-- popular cities -->

    <div id="cities">
      <div id="london"><p id="london_p"></p></div>
      <div id="paris"><p id="paris_p"></p></div>
      <div id="new-york"><p id="new-york_p"></p></div>
    </div>

    <!--5 day forecast-->
    <section class="container">
      <div class="row week-forecast" id="forecast"></div>
    </section>
    
  </main>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="script.js"></script>
</body>

</html>
